# Network probe (R24a, 2026-11-18): does translation reach the REAL services? Dispatch-only (never a push trigger; free minutes on a public repo).
#  job "jvm":      the real engine + the real HttpsTransport against MyMemory and Google on a JVM (RealServicesCheck, skipped in every normal test run)
#  job "emulator": the keyboard's own Diagnostics "Test translation connection" (ConnectionProbe) on a REAL Android emulator (API 29 = the tablet, 36 = Android 16),
#                  i.e. Android's own networking stack (okhttp-based HttpURLConnection, Conscrypt), via tools/emu/net_probe.sh
# Only the two translation hosts are contacted, with fixed test sentences (nothing anybody typed).
name: Network probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: net-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          gradle-cache: 'false'
      - name: Real services through the real engine (JVM)
        env:
          SWOOP_REAL_SERVICES: '1'
          SWOOP_REAL_OUT: ${{ github.workspace }}/service-check.txt
        run: |
          set +e
          ./gradlew :ime:testDebugUnitTest --tests '*RealServicesCheck*' --console=plain
          rc=$?
          [ -f service-check.txt ] && cat service-check.txt >> "$GITHUB_STEP_SUMMARY"
          [ -f service-check.txt ] && cat service-check.txt
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-check-jvm
          path: service-check.txt
          retention-days: 7
          if-no-files-found: ignore

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: ['29', '36']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          gradle-cache: 'false'
      - name: Build the debug APK
        run: ./gradlew :ime:assembleDebug --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot the emulator and run the probe
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: Nexus 7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/emu/net_probe.sh
      - name: Keep the probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-probe-api-${{ matrix.api }}
          path: emu-out
          retention-days: 7
          if-no-files-found: ignore
