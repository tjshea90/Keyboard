# Build, sign and release the Swoop keyboard APK on GitHub's runners (the owner's rule across all his repos: "GitHub actions should do all the
# app compiling and apk making. Claude codes the app, GitHub makes the apk.").
#
# Dispatch with  full_build = true  to test, build, verify and publish.  full_build = false is a ~1 minute check that the gates still pass.
# Claude dispatches it through the GitHub API (mcp__github__actions_run_trigger, run_workflow) after `bash ship.sh "note"`.
#
# MINUTES ARE THE SCARCE RESOURCE (the repo is private: GitHub Free gives 2,000 Actions minutes a month; tools/test_handoff.sh fails if either rule is undone):
#   1. NEVER add a `push:` branch trigger. autosave commits and pushes after every tool call; a push trigger would start a run every few
#      seconds. Tags and manual dispatch only.
#   2. Cheap gates first; a manual run does the gates only unless full_build is ticked.
#
# SIGNING (plan 11.5): the keyboard's key is PRIVATE. Every release APK must carry the certificate pinned in signing/CERT_SHA256, because
# Android refuses an update signed by anything else - and that is the only thing that stops a malicious APK from replacing a keyboard.
# While signing/CERT_SHA256 is UNSET (task KB-003 not done) a full build produces a DEBUG-signed test APK as a private workflow artifact and
# publishes NOTHING. tools/verify-apk.sh checks the ARTIFACT's certificate, not just the key that went in.
#
# GitHub creates the release tag itself (`gh release create --target`): a tag PUSH from the Claude sandbox is refused (403). This workflow COMMITS
# NOTHING (a workflow that pushed would retrigger the autosave machinery); tools/record-release.sh writes BUILDLOG.md after the run is green.
name: Build APK

on:
  push:
    tags: ['swoop-v*']
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Test, build, verify and publish (several minutes of Actions time). Leave OFF for a ~1 min check of the gates.'
        type: boolean
        default: false
      note:
        description: 'What changed in this release (goes into the Release text)'
        type: string
        default: ''

# Read-only by default. Only the build job publishes a Release (`gh release create`) and only it gets `contents: write`.
permissions:
  contents: read

# A second dispatch for the same ref WAITS instead of cancelling a run that may be in the middle of publishing.
# (The build job also holds a repo-wide lock, so two Claude sessions on different branches can never publish the same tag at once.)
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ seconds: decide the plan and run the cheap gates
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.plan.outputs.full }}
      signed: ${{ steps.plan.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false # the token is not left in .git/config for later steps

      - name: Decide how much of this run costs money
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full_build }}
        run: |
          full=false
          if [ "$EVENT" = "push" ]; then full=true; elif [ "$FULL" = "true" ]; then full=true; fi
          signed=false
          grep -Eq '^[0-9a-f]{64}$' signing/CERT_SHA256 && signed=true
          { echo "full=$full"; echo "signed=$signed"; } >> "$GITHUB_OUTPUT"
          if [ "$full" = true ] && [ "$signed" = true ]; then
            echo "FULL BUILD (tests, signed release APK, certificate check, publish)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$full" = true ]; then
            echo "FULL BUILD WITHOUT PUBLISHING: signing/CERT_SHA256 is UNSET (KB-003 not done), so this makes a debug-signed TEST APK (a private workflow artifact) and releases nothing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GATES ONLY. Re-run with **full_build** ticked, or create a Release tag, to build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gate - shell tooling self-test (save ladder, secret scan, privacy guards, workflow rules)
        run: bash tools/test_handoff.sh

      - name: Gate - versionCode is not a downgrade
        run: |
          . tools/appinfo.sh
          VC="$(app_vcode)"; PREV="$(app_last_code)"
          echo "$(app_title) $(app_vname) versionCode $VC, highest shipped $PREV"
          if [ "$VC" -lt "$PREV" ]; then
            echo "::error::versionCode $VC is LOWER than the highest shipped ($PREV): Android refuses a downgrade."
            exit 1
          fi
          # An EQUAL code is a rebuild of the current release (allowed: same certificate => in-place reinstall). ship.sh, which publishes
          # a NEW release, enforces the stricter "higher".

  # ------------------------------------------------------------------ minutes: the JVM suites + lint
  test-jvm:
    needs: check
    if: needs.check.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Core + tools + app unit tests, lint
        run: ./gradlew :core:test :tools:build :eval:compileKotlin :ime:testDebugUnitTest :ime:lintDebug --console=plain

  # ------------------------------------------------------------------ the APK
  build:
    needs: [check, test-jvm]
    if: needs.check.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the Release (signed runs only)
    timeout-minutes: 30
    concurrency:
      group: release-swoop
      cancel-in-progress: false
    env:
      SIGNED: ${{ needs.check.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build

      - name: Unlock the private signing key (signed runs only)
        if: env.SIGNED == 'true'
        env:
          SWOOP_KEYSTORE_PASSPHRASE: ${{ secrets.SWOOP_KEYSTORE_PASSPHRASE }}
        run: bash tools/signing-key.sh unlock

      - name: Build the release APK (R8, signed with the private key)
        if: env.SIGNED == 'true'
        run: ./gradlew :ime:assembleRelease --console=plain

      - name: Verify the APK itself (certificate pin, package, version, permissions, no GMS, size)
        if: env.SIGNED == 'true'
        run: bash tools/verify-apk.sh

      - name: Publish the Release
        if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
        run: bash .github/scripts/publish-release.sh

      - name: Build a debug-signed TEST apk (no signing key exists yet, nothing is published)
        if: env.SIGNED != 'true'
        run: ./gradlew :ime:assembleDebug --console=plain

      - name: Verify the structure of the test APK (everything except the certificate)
        if: env.SIGNED != 'true'
        run: bash tools/verify-apk.sh --no-cert ime/build/outputs/apk/debug/ime-debug.apk

      - name: Keep the test APK as a private workflow artifact (unsigned-pin runs only)
        if: env.SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swoop-test-apk
          path: ime/build/outputs/apk/debug/ime-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Remove the signing material from the workspace
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP"/*.jks "$RUNNER_TEMP"/*.p12
